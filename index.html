<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2d5016" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a2e12" media="(prefers-color-scheme: dark)">
<title>Exame do Cazador - Preparaci&oacute;n</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2d5016;--green-light:#4a7c24;--green-bg:#f0f5ec;--correct:#2e7d32;--wrong:#c62828;--orange:#e65100;--bg:#f5f5f5;--card:#fff;--text:#222;--text-light:#666;--border:#e0e0e0;--radius:12px;--correct-bg:#e8f5e9;--wrong-bg:#ffebee;--main-bg:#e3f2fd;--main-color:#1565c0;--reserve-bg:#f3e5f5;--reserve-color:#7b1fa2;--pending-bg:#fff3e0;--input-bg:#fff;--menu-bg:#fff}
@media(prefers-color-scheme:dark){:root{--green:#5a9e2f;--green-light:#6db83a;--green-bg:#1a2e12;--correct:#66bb6a;--wrong:#ef5350;--orange:#ffa726;--bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--text-light:#999;--border:#333;--correct-bg:#1b3a1b;--wrong-bg:#3a1b1b;--main-bg:#1a2a3a;--main-color:#64b5f6;--reserve-bg:#2a1a3a;--reserve-color:#ce93d8;--pending-bg:#2e2210;--input-bg:#2a2a2a;--menu-bg:#2a2a2a}}
html{-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.header{background:linear-gradient(135deg,var(--green),var(--green-light));color:#fff;padding:1rem;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:1.2rem;font-weight:700}
.header p{font-size:.8rem;opacity:.8;margin-top:.15rem}
.nav{display:flex;gap:.4rem;justify-content:center;padding:.6rem .5rem;background:var(--green-bg);flex-wrap:wrap;position:sticky;top:52px;z-index:99;position:relative}
.settings-menu{position:absolute;right:.5rem;top:100%;background:var(--menu-bg);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:.3rem;z-index:200;min-width:180px}
.settings-menu button{display:block;width:100%;text-align:left;padding:.5rem .8rem;border:none;background:none;font-size:.85rem;cursor:pointer;border-radius:6px}
.settings-menu button:hover{background:var(--green-bg)}
.nav button{padding:.4rem 1rem;border:2px solid var(--green);background:var(--card);color:var(--green);border-radius:25px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.nav button.active,.nav button:hover{background:var(--green);color:#fff}
.container{max-width:750px;margin:0 auto;padding:.8rem}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 6px rgba(0,0,0,.06);padding:1.2rem;margin-bottom:.8rem}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.q-number{display:inline-block;background:var(--green);color:#fff;border-radius:20px;padding:.15rem .7rem;font-size:.8rem;font-weight:700}
.q-cat{font-size:.7rem;color:var(--text-light);background:var(--green-bg);padding:.15rem .5rem;border-radius:10px}
.q-text{font-size:1rem;font-weight:500;margin-bottom:1rem;line-height:1.55}
.options{display:flex;flex-direction:column;gap:.45rem}
.option{padding:.75rem .9rem;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;font-size:.92rem;display:flex;align-items:flex-start;gap:.6rem;-webkit-user-select:none;user-select:none;active-scale:.98}
.option:active{transform:scale(.98)}
.option.selected{border-color:var(--green);background:var(--green-bg);font-weight:600}
.option.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);font-weight:600}
.option.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.option.show-correct{border-color:var(--correct);background:var(--correct-bg)}
.option .letter{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:50%;background:var(--border);font-weight:700;font-size:.8rem;flex-shrink:0;transition:all .15s}
.option.correct .letter{background:var(--correct);color:#fff}
.option.wrong .letter{background:var(--wrong);color:#fff}
.option.show-correct .letter{background:var(--correct);color:#fff}
.option.locked{pointer-events:none}
.btn{padding:.55rem 1.3rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;-webkit-user-select:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-light)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--border);filter:brightness(1.1)}
.btn-sm{padding:.35rem .8rem;font-size:.8rem}
.controls{display:flex;gap:.4rem;justify-content:center;margin-top:.8rem;flex-wrap:wrap}
.progress-bar{height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin-bottom:.8rem}
.progress-fill{height:100%;background:var(--green);transition:width .3s;border-radius:3px}
.stats{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-bottom:.8rem}
.stat{text-align:center;padding:.4rem .8rem}
.stat-value{font-size:1.4rem;font-weight:700}
.stat-label{font-size:.7rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px}
.stat-correct .stat-value{color:var(--correct)}
.stat-wrong .stat-value{color:var(--wrong)}
.stat-pending .stat-value{color:var(--orange)}
.exam-config{text-align:center;padding:1.5rem .8rem}
.exam-config h2{font-size:1.2rem;margin-bottom:.6rem;color:var(--green)}
.exam-config p{color:var(--text-light);margin-bottom:1rem;font-size:.9rem}
.config-grid{display:flex;flex-direction:column;gap:.6rem;align-items:center;margin-bottom:1.2rem}
.config-row{display:flex;align-items:center;gap:.6rem;font-size:.9rem}
.config-row select{padding:.35rem .5rem;border:2px solid var(--border);border-radius:6px;font-size:.9rem;background:var(--input-bg);color:var(--text)}
.result-screen{text-align:center;padding:1.5rem .8rem}
.result-screen h2{font-size:1.5rem;margin-bottom:.3rem}
.result-score{font-size:2.5rem;font-weight:800;margin:.8rem 0}
.result-pass{color:var(--correct)}
.result-fail{color:var(--wrong)}
.cat-grid{display:flex;gap:.35rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.3rem;margin-bottom:.8rem;scrollbar-width:none}
.cat-grid::-webkit-scrollbar{display:none}
.cat-chip{padding:.3rem .65rem;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;text-align:center;transition:all .15s;font-size:.78rem;font-weight:500;white-space:nowrap;flex-shrink:0}
.cat-chip:active{transform:scale(.97)}
.cat-chip.active{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:700}
.cat-chip .cat-count{font-size:.7rem;color:var(--text-light);margin-left:.15rem}
.cat-chip.active .cat-count{color:var(--green)}
.counter-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;font-size:.82rem;color:var(--text-light)}
.tag{display:inline-block;padding:.1rem .4rem;border-radius:4px;font-size:.7rem;font-weight:600}
.tag-pending{background:var(--pending-bg);color:var(--orange)}
.tag-main{background:var(--main-bg);color:var(--main-color)}
.tag-reserve{background:var(--reserve-bg);color:var(--reserve-color)}
.chip-main{border-color:var(--main-color)!important;background:var(--main-bg)!important;color:var(--main-color)!important}
.chip-reserve{border-color:var(--reserve-color)!important;background:var(--reserve-bg)!important;color:var(--reserve-color)!important}
.bookmark-btn{background:none;border:none;font-size:1.2rem;cursor:pointer;padding:.1rem .3rem}
.next-hint{text-align:center;margin-top:.6rem;font-size:.8rem;color:var(--text-light);opacity:0;transition:opacity .3s}
.next-hint.visible{opacity:1}
.search-wrap{position:relative;margin-bottom:.8rem}
.search-box{width:100%;padding:.6rem .9rem;padding-left:2.2rem;border:2px solid var(--border);border-radius:10px;font-size:.9rem;background:var(--input-bg);color:var(--text)}
.search-box:focus{outline:none;border-color:var(--green)}
.search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:.9rem}
.hidden{display:none}
@media(max-width:500px){
  .container{padding:.5rem}
  .card{padding:.9rem;border-radius:10px}
  .header{padding:.8rem}
  .header h1{font-size:1.05rem}
  .q-text{font-size:.93rem}
  .option{padding:.65rem .75rem;font-size:.88rem}
  .nav{top:46px}
}
</style>
</head>
<body>

<div class="header">
<h1>Exame do Cazador - Galicia</h1>
<p>454 preguntas &bull; Federaci&oacute;n Galega de Caza</p>
</div>

<div class="nav">
<button id="nav-practice" onclick="go('practice')">Practicar</button>
<button id="nav-exam" onclick="go('exam')">Exame</button>
<button id="nav-browse" onclick="go('browse')">Buscar</button>
<button id="nav-review" onclick="go('review')">Erros</button>
<button onclick="toggleMenu()" style="margin-left:auto;border-color:var(--text-light);color:var(--text-light)" id="menu-btn">&#9881;</button>
<div id="settings-menu" class="settings-menu hidden">
<button onclick="exportProgress()">Exportar progreso</button>
<button onclick="importProgress()">Importar progreso</button>
<button onclick="resetAll()" style="color:var(--wrong)">Reiniciar todo</button>
</div>
</div>

<div class="container" id="app"></div>

<script>
const Q=[{"number":1,"question":"Cando un cazador, fire unha peza de caza en terreo no que está autorizado para cazar, e coa finalidade de cobrala, ¿pode entrar en terreo distinto, no que non está autorizado para practicar a caza?","options":["En ningún caso.","En todos os casos, sempre que entre só, sen armas nin can.","En terreos abertos sometidos a réxime cinexético especial, e para pezas de caza menor, (sempre que sexa visible desde o linde, e debe entrar a cobrala coa arma descargada) cando o cazador entre a cobrala peza só, sen armas nin can, ou en terreos cercados con autorización do seu titular ou representante."],"correct":2,"category":"tecor"},{"number":2,"question":"No transcurso dunha batida, si un corzo sae a varios postos e é ferido nun deles e resulta morto e cobrado noutro distinto, ¿a que cazador lle corresponde a peza de caza?.","options":["Ao que matou e cobrou o corzo","Ao xefe de cuadrilla","Ao cazador que lle ocasionou o primeiro sangue"],"correct":2,"category":"mamiferos"},{"number":3,"question":"Si un cazador que está adestrando os seus cans, observa un comportamento anormal por exemplo dos coellos, que o fai sospeitar da existencia dunha enfermidade, debe:","options":["Recoller os cans e non volver a adestralos, dado que se corre o risco de transmisión da posible enfermidade","Seguir adestrando os cans, non comunicando nada, dado que é algo que sucede con frecuencia.","Comunicárllelo de inmediato ás autoridades ou aos seus axentes."],"correct":2,"category":"mamiferos"},{"number":4,"question":"A xornada de caza comeza:","options":["Ás 8.00 horas.","Cando hai suficiente visibilidade.","Unha hora antes da saída do sol."],"correct":2,"category":"licencias"},{"number":5,"question":"A xornada de caza remata:","options":["Ás 19:00 horas.","Cando non hai visibilidade suficiente.","Unha hora despois do ocaso, excepto no caso de modalidades de caza nocturna expresamente autorizadas."],"correct":2,"category":"licencias"},{"number":6,"question":"Cando no exercicio da caza, se cobre un exemplar dunha especie cinexética que porte algún tipo de anel ou marca identificadora, o cazador debe:","options":["Amputar a parte do animal na que figura a marca ou anel e remitila ao Concello na que foi cobrada a peza.","Comunicarllo á Consellería de Medio Ambiente, Territorio e Infraestruturas, facéndolle chegar aqueles sinais e os datos sobre o lugar e tempo de aprehensión.","Ao tratarse dunha especie cinexética, non hai a obriga de comunicar nada."],"correct":1,"category":"tecor"},{"number":7,"question":"Unha persoa con idade menor de dezaseis anos pode practicar a caza:","options":["Non.","Si, sempre acompañado dalgún cazador maior de idade.","Si, sempre acompañado dalgún cazador maior de idade, para poder cazar con armas."],"correct":0,"category":"licencias"},{"number":8,"question":"Na práctica da caza do raposo na modalidade de batida, ¿cal das municións seguintes non se debe empregar?:","options":["Munición con peso unitario inferior a 2,5 gramos.","Munición con peso unitario superior a 2,5 gramos.","Balas."],"correct":0,"category":"mamiferos"},{"number":9,"question":"A caza dende embarcacións e vehículos terrestres en movemento, está:","options":["Autorizada nas reservas nacionais de caza.","Prohibida.","Autorizada en todo tipo de terreos cinexéticos."],"correct":1,"category":"normativa"},{"number":10,"question":"Nunha batida realizada realizado nun Tecor cobráronse un total de 4 xabarís, a carne destes exemplares vai a ser distribuída entre os cazadores que participaron na cacería, ditos cazadores para realizar o transporte destes restos deben:","options":["Colocar un precinto a cada bolsa de transporte.","Levar unha guía expedida polo responsable da cacería.","Coa autorización para realizar a batida é suficiente."],"correct":1,"category":"tecor"},{"number":11,"question":"¿Quén poderá solicitar a celebración de batidas ou zapeos cando a caza dunha zona sometida a réxime cinexético común produza danos?","options":["Os concellos onde se produzan os danos","Os sindicatos agrarios como representantes dos prexudicados","Directamente os labregos e gandeiros mediante a recollida de sinaturas"],"correct":0,"category":"tecor"},{"number":12,"question":"¿Quén pode conceder o permiso para a celebración de batidas ou zapeos cando a caza dunha zona sometida a réxime cinexético común produza danos ?","options":["O Servizo Provincial de Patrimonio Natural","A Delegación Provincial da Consellería de Medio Ambiente, Territorio e Infraestruturas","A Dirección Xeral de Patrimonio Natural"],"correct":1,"category":"tecor"},{"number":13,"question":"Un exemplar dunha especie cinexética procedente dunha explotación cinexética provoca danos nunha finca particular, ¿quén deberá indemnizar os danos?","options":["Non hai dereito a indemnización","O titular do aproveitamento cinexético","A Consellería do Medio (Ambiente)Rural"],"correct":1,"category":"tecor"},{"number":14,"question":"¿Cal das seguintes especies non se reproduce en Galicia?","options":["Pato real (Anas platyrhynchos)","Charrela (Perdix perdix)","Ganso común (Anser anser)"],"correct":2,"category":"aves"},{"number":15,"question":"A maior poboación de paspallás preséntase en Galicia entre:","options":["Todo o ano","Abril e setembro","Xullo e decembro"],"correct":1,"category":"aves"},{"number":16,"question":"¿Cál das seguintes especies non é cinexética en Galicia?","options":["Tordo común (Turdus philomenos)","Estorniño pinto (Sturnus vulgaris)","Merlo común (Turdus merula)"],"correct":2,"category":"aves"},{"number":17,"question":"As crías de xabaril nacen cunha pelaxe moi característica polo que se lles coñece como:","options":["Pintóns","Listóns","Raións"],"correct":2,"category":"mamiferos"},{"number":18,"question":"¿Cál das femias das seguintes especies non posúen cornos?","options":["Corzo","Muflón","Cabra montés"],"correct":0,"category":"mamiferos"},{"number":19,"question":"O número máximo de puntas que pode presentar unha corna, considerada como normal, nun corzo é de:","options":["3","4","5"],"correct":0,"category":"mamiferos"},{"number":20,"question":"A posta da perdiz rubia soe contar, normalmente, cun número de ovos","options":["De 6 a 10","De 10 a 15","Mais de 20"],"correct":1,"category":"aves"},{"number":21,"question":"¿Cál destas especies non é cinexética en Galicia?","options":["Pato rabilongo (Anas acuta)","Somorgullo lavanco (Podiceps cristatus)","Parrulo cristado (Aythya fuligula)"],"correct":1,"category":"aves"},{"number":22,"question":"Unha camada de lebre componse, xeralmente, de:","options":["2 a 5 lebratos","5 a 8 “","1 lebrato"],"correct":0,"category":"mamiferos"},{"number":23,"question":"¿Cómo distinguiremos o sexo dun corzo no mes de novembro?","options":["Mediante a observación das cornas totalmente desenvolvidas nos machos","Pola diferenza de cor, agrisado nos machos e roxizo nas femias","Pola forma do escudo anal, en forma de ril nos machos e de corazón nas femias"],"correct":2,"category":"mamiferos"},{"number":24,"question":"¿Cal destes animais supón o maior predador do xabaril en Galicia?","options":["O lobo","O raposo","O oso 25ª O macho de perdiz rubia, na época de celo e crianza, ¿establece e defende un territorio?.","Nunca.","Sempre.","Soamente fronte a exemplares de perdiz charrela"],"correct":4,"category":"aves"},{"number":26,"question":"Os polos de perdiz son:","options":["Nidífugos.","Permanencen no niño ata a segunda semana de vida.","Ningunha das respostas anteriores é válida."],"correct":0,"category":"aves"},{"number":27,"question":"Os polos de perdiz durante a primeira semana de vida aliméntase fundamentalmente de:","options":["Gran de cereais.","Sementes de plantas silvestres.","Insectos"],"correct":2,"category":"aves"},{"number":28,"question":"No xabaril, o trofeo de caza valórase atendendo:","options":["As súas características morfolóxicas","Ao peso dos exemplares, así como a súa coloración.","As características da súa dentadura, (colmillos e amoladeras)."],"correct ategory":"licencias"},{"number":38,"question":"¿Cal é o tamaño da franxa de seguridade arredor dun núcleo de poboación?","options":["50 metros.","100 metros.","250 metros."],"correct":1,"category":"licencias"},{"number":39,"question":"Se temos unha casa no medio do monte ¿haberá zona de seguridade ao seu arredor?","options":["Sí, se o terreo.é cinexético de aproveitamento especial.","Non, se o terreo é de aproveitamento cinexético común.","Sí, sempre."],"correct":2,"category":"tecor"},{"number":40,"question":"Si no meu Tecor existe un parque empresarial no medio ¿terá zona de seguridade?","options":["Sí, sempre.","Sí, se non se atopa valado.","Non, se se atopa valado."],"correct":0,"category":"tecor"},{"number":41,"question":"¿Cómo se consideran os terreos cercado?","options":["Dependerá das circunstancias particulares da cada un.","Zona de seguridade sempre.","Terreo non cinexético sempre."],"correct":0,"category":"licencias"},{"number":42,"question":"¿Qué non se pode facer nas zonas de seguridade?","options":["Circular coas armas cargadas aínda que sen disparar.","Disparar en dirección ás mesmas desde fora delas.","Ningunha das dúas cousas."],"correct":2,"category":"licencias"},{"number":43,"question":"Nos carreiros e camiños rurais pódese","options":["Cazar tendo coidado coas medidas de seguridade.","Non se pode circular coas armas cargadas por ser zonas de seguridade.","Non se pode disparar por ser unha zona de seguridade."],"correct":0,"category":"licencias"},{"number":44,"question":"Os períodos hábiles de caza para cada temporada, establécense:","options":["No regulamento de caza.","Nunha orde anual da Consellería de Medio Ambiente, Territorio e Infraestruturas.","Ningunha das anteriores."],"correct":1,"category":"administracion"},{"number":45,"question":"¿A quén corresponde o coidado e vixilancia dos refuxios de fauna?","options":["Ás Sociedades ou Asociacións ecoloxistas que promoveran a súa declaración","Á Consellería de Medio Ambiente, Territorio e Infraes const CAT_LABELS={"aves":"Aves cinexéticas","mamiferos":"Mamíferos cinexéticos","normativa":"Normativa e seguridade","armas":"Armas e municións","modalidades":"Modalidades de caza","licencias":"Licenzas e documentación","sancions":"Sancións e infraccións","tecor":"TECOR e terreos","cans":"Cans e animais perigosos","administracion":"Administración e lexislación"};
const CAT_ORDER=["aves","mamiferos","normativa","armas","modalidades","licencias","sancions","tecor","cans","administracion"];

let S={
  mode:'practice',
  // Practice
  pool:[],
  pIdx:0,
  pAnswered:{},
  pCorrect:0,
  pWrong:0,
  pTotal:0,
  pCat:'all',
  // Exam
  eq:[],
  eIdx:0,
  ea:[],
  // Browse
  bIdx:0,
  bSearch:'',
  bCat:'all',
  // Persist
  wrong:JSON.parse(localStorage.getItem('cz_w')||'{}'),
  marks:JSON.parse(localStorage.getItem('cz_m')||'{}'),
};

function save(){localStorage.setItem('cz_w',JSON.stringify(S.wrong));localStorage.setItem('cz_m',JSON.stringify(S.marks));}
function resetAll(){if(!confirm('Reiniciar todo o progreso? (erros, marcadores, respostas)'))return;S.wrong={};S.marks={};S.pAnswered={};S.pCorrect=0;S.pWrong=0;localStorage.removeItem('cz_w');localStorage.removeItem('cz_m');initPractice();render();toggleMenu();}
function toggleMenu(){document.getElementById('settings-menu').classList.toggle('hidden');}
function exportProgress(){const d=JSON.stringify({wrong:S.wrong,marks:S.marks});navigator.clipboard.writeText(d).then(()=>alert('Progreso copiado ao portapapeis. Pégao no outro dispositivo con "Importar progreso".')).catch(()=>{prompt('Copia este texto:',d);});toggleMenu();}
function importProgress(){const t=prompt('Pega aquí o texto exportado:');if(!t)return;try{const d=JSON.parse(t);if(d.wrong)S.wrong=d.wrong;if(d.marks)S.marks=d.marks;save();initPractice();render();alert('Progreso importado correctamente!');}catch(e){alert('Erro: o texto non é válido');}toggleMenu();}
document.addEventListener('click',e=>{const m=document.getElementById('settings-menu');const b=document.getElementById('menu-btn');if(!m.classList.contains('hidden')&&!m.contains(e.target)&&e.target!==b)m.classList.add('hidden');});

function go(m){
  S.mode=m;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+m).classList.add('active');
  if(m==='practice')initPractice();
  render();
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function initPractice(){
  let pool=S.pCat==='all'?Q:S.pCat==='main'?Q.filter(q=>q.number<=100):S.pCat==='reserve'?Q.filter(q=>q.number>100):Q.filter(q=>q.category===S.pCat);
  S.pool=shuffle(pool);
  S.pIdx=0;
  S.pAnswered={};
  S.pCorrect=0;
  S.pWrong=0;
  S.pTotal=pool.length;
}

function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cleanOpt(t){return t.replace(/Pendente de resolver/gi,'').replace(/Cambiar resposta/gi,'').replace(/modificar$/gi,'').replace(/Resposta correcta/gi,'').replace(/Nada na nova lei/gi,'').trim().replace(/\s{2,}/g,' ');}

function optClass(qn,i,c){
  if(S.mode==='practice'){
    if(S.pAnswered[qn]===undefined)return'';
    if(i===c)return'correct locked';
    if(S.pAnswered[qn]===i)return'wrong locked';
    return'locked';
  }
  if(S.mode==='exam'){
    const idx=S.eq.indexOf(qn);
    if(S.ea[idx]===i)return'selected';
    return'';
  }
  if(S.mode==='browse'){
    if(S.pAnswered[qn]===undefined)return'';
    if(i===c)return'correct locked';
    if(S.pAnswered[qn]===i)return'wrong locked';
    return'locked';
  }
  return'';
}

function catCounts(){const c={};Q.forEach(q=>{c[q.category]=(c[q.category]||0)+1});return c;}

function render(){
  const app=document.getElementById('app');
  if(S.mode==='practice')renderPractice(app);
  else if(S.mode==='exam')renderExam(app);
  else if(S.mode==='browse')renderBrowse(app);
  else if(S.mode==='review')renderReview(app);
}

function renderPractice(el){
  if(!S.pool.length)initPractice();
  const cc=catCounts();
  const q=S.pool[S.pIdx];
  if(!q){initPractice();return render();}
  const answered=S.pAnswered[q.number]!==undefined;
  const progress=((S.pIdx+1)/S.pool.length)*100;
  const wrongC=Object.keys(S.wrong).length;

  el.innerHTML=`
    <div class="cat-grid">
      <div class="cat-chip ${S.pCat==='all'?'active':''}" onclick="setCat('all')">Todas<span class="cat-count">${Q.length}</span></div>
      <div class="cat-chip ${S.pCat==='main'?'active chip-main':''}" onclick="setCat('main')">Bloque principal<span class="cat-count">100</span></div>
      <div class="cat-chip ${S.pCat==='reserve'?'active chip-reserve':''}" onclick="setCat('reserve')">Reserva<span class="cat-count">${Q.length-100}</span></div>
      ${CAT_ORDER.map(c=>`<div class="cat-chip ${S.pCat===c?'active':''}" onclick="setCat('${c}')">${CAT_LABELS[c]}<span class="cat-count">${cc[c]||0}</span></div>`).join('')}
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="counter-row">
      <span>${S.pIdx+1} / ${S.pool.length}</span>
      <span style="color:var(--correct)">${S.pCorrect} correctas</span>
      <span style="color:var(--wrong)">${S.pWrong} erros</span>
    </div>
    ${renderQuestion(q,answered)}
    <div class="next-hint ${answered?'visible':''}">${answered?'Toca "Seguinte" ou desliza para continuar':''}</div>
    <div class="controls">
      <button class="btn btn-secondary" onclick="pPrev()">&#9664;</button>
      <button class="btn btn-primary" onclick="pNext()">Seguinte &#9654;</button>
      <button class="btn btn-secondary btn-sm" onclick="initPractice();render()">Barallar</button>
    </div>
  `;
}

function renderQuestion(q, locked){
  const isPending=q.options.some(o=>o.toLowerCase().includes('pendente de resolver'));
  const isMarked=S.marks[q.number];
  const bloque=q.number<=100?'<span class="tag tag-main">Bloque principal</span>':'<span class="tag tag-reserve">Reserva</span>';
  return `
    <div class="card">
      <div class="q-header">
        <div>
          <span class="q-number">${q.number}ª</span>
          ${bloque}
          ${isPending?'<span class="tag tag-pending">Pendente</span>':''}
        </div>
        <div>
          <span class="q-cat">${CAT_LABELS[q.category]||q.category}</span>
          <button class="bookmark-btn" onclick="toggleMark(${q.number})">${isMarked?'★':'☆'}</button>
        </div>
      </div>
      <div class="q-text">${escHtml(q.question)}</div>
      <div class="options">
        ${q.options.map((o,i)=>`
          <div class="option ${optClass(q.number,i,q.correct)}" onclick="answer(${q.number},${i},${q.correct})">
            <span class="letter">${'ABC'[i]||String(i+1)}</span>
            <span>${escHtml(cleanOpt(o))}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function answer(qn,sel,cor){
  if(S.pAnswered[qn]!==undefined)return;
  S.pAnswered[qn]=sel;
  if(sel===cor){S.pCorrect++;delete S.wrong[qn];}
  else{S.pWrong++;S.wrong[qn]=true;}
  save();render();
}

function pNext(){S.pIdx=Math.min(S.pool.length-1,S.pIdx+1);render();window.scrollTo(0,0);}
function pPrev(){S.pIdx=Math.max(0,S.pIdx-1);render();window.scrollTo(0,0);}

function setCat(c){S.pCat=c;initPractice();render();}

function toggleMark(n){if(S.marks[n])delete S.marks[n];else S.marks[n]=true;save();render();}

// Exam
function renderExam(el){
  if(!S.eq.length){renderExamSetup(el);return;}
  // Check if showing results
  if(S.examDone){renderExamResults(el);return;}
  const idx=S.eIdx;
  const qn=S.eq[idx];
  const q=Q.find(x=>x.number===qn);
  const total=S.eq.length;
  const answered=S.ea.filter(a=>a!==-1).length;
  const progress=(answered/total)*100;

  el.innerHTML=`
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="counter-row">
      <span>Pregunta ${idx+1} de ${total}</span>
      <span>Respondidas: ${answered}/${total}</span>
    </div>
    <div class="card">
      <div class="q-header">
        <div><span class="q-number">${q.number}ª</span> ${q.number<=100?'<span class="tag tag-main">Bloque principal</span>':'<span class="tag tag-reserve">Reserva</span>'}</div>
        <span class="q-cat">${CAT_LABELS[q.category]||''}</span>
      </div>
      <div class="q-text">${escHtml(q.question)}</div>
      <div class="options">
        ${q.options.map((o,i)=>`
          <div class="option ${S.ea[idx]===i?'selected':''}" onclick="examAns(${idx},${i})">
            <span class="letter">${'ABC'[i]||i}</span>
            <span>${escHtml(cleanOpt(o))}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-secondary" ${idx===0?'disabled':''} onclick="S.eIdx--;render()">&#9664;</button>
      <button class="btn btn-secondary" ${idx===total-1?'disabled':''} onclick="S.eIdx++;render()">&#9654;</button>
      <button class="btn btn-primary" onclick="finishExam()">${answered===total?'Rematar':'Entregar'}</button>
    </div>
  `;
}

function renderExamSetup(el){
  const wc=Object.keys(S.wrong).length;
  el.innerHTML=`
    <div class="card exam-config">
      <h2>Simulador de Exame</h2>
      <p>No exame real: 40 de 60 preguntas sa&iacute;n das primeiras 100</p>
      <div class="config-grid">
        <div class="config-row"><label>N&uacute;mero:</label><select id="ec"><option value="10">10</option><option value="20">20</option><option value="40" selected>40</option><option value="60">60</option><option value="100">100</option></select></div>
        <div class="config-row"><label>Fonte:</label><select id="es"><option value="first100">Primeiras 100</option><option value="all" selected>Todas</option>${wc?`<option value="wrong">Falladas (${wc})</option>`:''}</select></div>
      </div>
      <button class="btn btn-primary" style="font-size:1rem;padding:.7rem 2rem" onclick="startExam()">Comezar</button>
    </div>
  `;
}

function startExam(){
  const n=parseInt(document.getElementById('ec').value);
  const src=document.getElementById('es').value;
  let pool=Q;
  if(src==='first100')pool=pool.filter(q=>q.number<=100);
  else if(src==='wrong')pool=pool.filter(q=>S.wrong[q.number]);
  const sel=shuffle(pool).slice(0,Math.min(n,pool.length));
  S.eq=sel.map(q=>q.number);
  S.ea=new Array(S.eq.length).fill(-1);
  S.eIdx=0;
  S.examDone=false;
  render();
}

function examAns(idx,i){S.ea[idx]=i;render();}

function finishExam(){
  S.examDone=true;
  // Grade
  let c=0,w=0,u=0;
  S.eq.forEach((qn,i)=>{
    const q=Q.find(x=>x.number===qn);
    if(S.ea[i]===-1)u++;
    else if(S.ea[i]===q.correct){c++;delete S.wrong[qn];}
    else{w++;S.wrong[qn]=true;}
  });
  S.examResult={c,w,u};
  save();render();
}

function renderExamResults(el){
  const{c,w,u}=S.examResult;
  const total=S.eq.length;
  const pct=Math.round((c/total)*100);
  const pass=pct>=75;
  el.innerHTML=`
    <div class="card result-screen">
      <h2>${pass?'Aprobado!':'Suspenso'}</h2>
      <div class="result-score ${pass?'result-pass':'result-fail'}">${pct}%</div>
      <div class="stats">
        <div class="stat stat-correct"><div class="stat-value">${c}</div><div class="stat-label">Correctas</div></div>
        <div class="stat stat-wrong"><div class="stat-value">${w}</div><div class="stat-label">Incorrectas</div></div>
        ${u?`<div class="stat stat-pending"><div class="stat-value">${u}</div><div class="stat-label">Sen resposta</div></div>`:''}
      </div>
      <p style="color:var(--text-light);margin:.8rem 0;font-size:.85rem">${c}/${total} &bull; M&iacute;nimo para aprobar: 75%</p>
      <div class="controls">
        <button class="btn btn-primary" onclick="reviewExam()">Ver respostas</button>
        <button class="btn btn-secondary" onclick="S.eq=[];S.examDone=false;render()">Novo exame</button>
      </div>
    </div>
  `;
}

function reviewExam(){
  const el=document.getElementById('app');
  let h='<div class="controls" style="margin-bottom:.8rem"><button class="btn btn-secondary" onclick="S.eq=[];S.examDone=false;render()">Novo exame</button></div>';
  S.eq.forEach((qn,i)=>{
    const q=Q.find(x=>x.number===qn);
    const ua=S.ea[i];
    const ok=ua===q.correct;
    h+=`<div class="card" style="border-left:4px solid ${ua===-1?'var(--orange)':ok?'var(--correct)':'var(--wrong)'}">
      <div class="q-header"><div><span class="q-number">${q.number}ª</span> ${q.number<=100?'<span class="tag tag-main">Principal</span>':'<span class="tag tag-reserve">Reserva</span>'}</div><span class="q-cat">${CAT_LABELS[q.category]||''}</span></div>
      <div class="q-text">${escHtml(q.question)}</div>
      <div class="options">${q.options.map((o,j)=>`
        <div class="option ${j===q.correct?'show-correct':''}${ua===j&&j!==q.correct?' wrong':''} locked">
          <span class="letter">${'ABC'[j]||j}</span>
          <span>${escHtml(cleanOpt(o))}</span>
        </div>`).join('')}
      </div></div>`;
  });
  el.innerHTML=h;
}

// Browse
function renderBrowse(el){
  let pool=S.bCat==='all'?Q:S.bCat==='main'?Q.filter(q=>q.number<=100):S.bCat==='reserve'?Q.filter(q=>q.number>100):S.bCat==='marks'?Q.filter(q=>S.marks[q.number]):Q.filter(q=>q.category===S.bCat);
  if(S.bSearch){const t=S.bSearch.toLowerCase();pool=pool.filter(q=>q.question.toLowerCase().includes(t)||q.options.some(o=>o.toLowerCase().includes(t))||String(q.number)===S.bSearch);}
  if(S.bIdx>=pool.length)S.bIdx=Math.max(0,pool.length-1);
  const cc=catCounts();
  const mc=Object.keys(S.marks).length;

  let h=`
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-box" type="text" placeholder="Buscar por texto ou n&uacute;mero..." value="${S.bSearch}" oninput="S.bSearch=this.value;S.bIdx=0;render()">
    </div>
    <div class="cat-grid">
      <div class="cat-chip ${S.bCat==='all'?'active':''}" onclick="S.bCat='all';S.bIdx=0;render()">Todas<span class="cat-count">${Q.length}</span></div>
      <div class="cat-chip ${S.bCat==='main'?'active':''}" onclick="S.bCat='main';S.bIdx=0;render()">Bloque principal<span class="cat-count">100</span></div>
      <div class="cat-chip ${S.bCat==='reserve'?'active':''}" onclick="S.bCat='reserve';S.bIdx=0;render()">Reserva<span class="cat-count">${Q.length-100}</span></div>
      ${mc?`<div class="cat-chip ${S.bCat==='marks'?'active':''}" onclick="S.bCat='marks';S.bIdx=0;render()">Marcadas<span class="cat-count">${mc}</span></div>`:''}
      ${CAT_ORDER.map(c=>`<div class="cat-chip ${S.bCat===c?'active':''}" onclick="S.bCat='${c}';S.bIdx=0;render()">${CAT_LABELS[c]}<span class="cat-count">${cc[c]||0}</span></div>`).join('')}
    </div>`;

  if(!pool.length){
    h+='<div class="card" style="text-align:center;padding:1.5rem"><p>Non se atoparon preguntas</p></div>';
  } else {
    const q=pool[S.bIdx];
    const answered=S.pAnswered[q.number]!==undefined;
    h+=`<div class="counter-row"><span>${S.bIdx+1} de ${pool.length}</span></div>`;
    h+=renderQuestion(q,answered);
    h+=`<div class="controls">
      <button class="btn btn-secondary" onclick="S.bIdx=Math.max(0,S.bIdx-1);render();window.scrollTo(0,0)">&#9664;</button>
      <input type="number" min="1" max="${pool.length}" value="${S.bIdx+1}" style="width:60px;text-align:center;padding:.3rem;border:2px solid var(--border);border-radius:6px;font-size:.9rem" onchange="S.bIdx=Math.max(0,Math.min(${pool.length}-1,parseInt(this.value)-1));render()">
      <button class="btn btn-secondary" onclick="S.bIdx=Math.min(${pool.length}-1,S.bIdx+1);render();window.scrollTo(0,0)">&#9654;</button>
    </div>`;
  }
  el.innerHTML=h;
}

// Review wrong answers
function renderReview(el){
  const wn=Object.keys(S.wrong).map(Number).sort((a,b)=>a-b);
  if(!wn.length){
    el.innerHTML='<div class="card" style="text-align:center;padding:2rem"><h3 style="margin-bottom:.5rem">Sen erros!</h3><p style="color:var(--text-light)">As preguntas que falles aparecer&aacute;n aqu&iacute;</p></div>';
    return;
  }
  el.innerHTML=`
    <div class="stats">
      <div class="stat stat-wrong"><div class="stat-value">${wn.length}</div><div class="stat-label">Preguntas falladas</div></div>
    </div>
    <div class="controls" style="margin-bottom:.8rem">
      <button class="btn btn-primary" onclick="practiceWrong()">Practicar erros</button>
      <button class="btn btn-secondary btn-sm" onclick="S.wrong={};save();render()">Limpar</button>
    </div>
    ${wn.map(n=>{const q=Q.find(x=>x.number===n);if(!q)return'';return`
      <div class="card">
        <div class="q-header"><div><span class="q-number">${q.number}ª</span> ${q.number<=100?'<span class="tag tag-main">Principal</span>':'<span class="tag tag-reserve">Reserva</span>'}</div><span class="q-cat">${CAT_LABELS[q.category]||''}</span></div>
        <div class="q-text">${escHtml(q.question)}</div>
        <div class="options">${q.options.map((o,i)=>`
          <div class="option ${i===q.correct?'show-correct':''} locked">
            <span class="letter">${'ABC'[i]||i}</span>
            <span>${escHtml(cleanOpt(o))}</span>
          </div>`).join('')}
        </div></div>`;
    }).join('')}
  `;
}

function practiceWrong(){
  S.pCat='all';
  const wn=Object.keys(S.wrong).map(Number);
  S.pool=shuffle(Q.filter(q=>wn.includes(q.number)));
  S.pIdx=0;S.pAnswered={};S.pCorrect=0;S.pWrong=0;S.pTotal=S.pool.length;
  S.mode='practice';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-practice').classList.add('active');
  render();
}

// Swipe support
let touchStartX=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)<60)return;
  if(S.mode==='practice'){
    if(dx<0)pNext();else pPrev();
  }else if(S.mode==='browse'){
    const pool=S.bCat==='all'?Q:Q.filter(q=>q.category===S.bCat);
    if(dx<0)S.bIdx=Math.min(pool.length-1,S.bIdx+1);
    else S.bIdx=Math.max(0,S.bIdx-1);
    render();window.scrollTo(0,0);
  }
},{passive:true});

// Keyboard support
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(S.mode==='practice'){
    if(e.key==='ArrowRight'||e.key===' ')pNext();
    if(e.key==='ArrowLeft')pPrev();
  }
});

// Init
go('practice');
</script>
</body>
</html>
